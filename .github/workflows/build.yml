name: Build dictionary

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Prepare Environment for Fetch
        run: pip install beautifulsoup4 requests tenacity

      - name: Fetch
        run: python DictSpider.py

      - name: Prepare Environment for Build
        run: |
          sudo apt install libime-bin

          wget https://github.com/studyzy/imewlconverter/releases/download/v3.6.0/imewlconverter_linux-x64.tar.gz
          tar -zxf imewlconverter_linux-x64.tar.gz
          echo "${GITHUB_WORKSPACE}" >> "$GITHUB_PATH"

      - name: Build
        run: |
          make build_fcitx build_rime
          tar -zcf sougou_dict.tar.gz sougou_dict

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          path: |
            sougou_dict.tar.gz
            sougou.dict
            sougou.dict.yaml
